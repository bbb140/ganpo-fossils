<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赣鄱石语 · 化石图鉴探索</title>
<style>
  :root{--ink:#26332e;--muted:#737f78;--line:#e3e7e1;--paper:#f6f7f2;--card:#fff;
    --green:#3c806d;--green-d:#2b5f51;--green-l:#e9f3ef;
    --amber:#b5842f;--amber-l:#fbf1dd;--purple:#6a5aa8;--purple-l:#efeefa;
    --lock:#a3aaa3;--lock-bg:#f0f1ed;--shadow:0 6px 22px rgba(30,50,40,.10)}
  *{box-sizing:border-box}
  /* 与主站一致的导航（沿用主站色板变量，保证换肤同步） */
  :root{--c-primary:#2E5E4E;--c-text:#222;--c-bg:#fff;--c-surface:#f5f5f0;--c-border:#ddd}
  /* 导航吸顶：只作用于顶层的导航 header；.wrap>header 是页内标题区，不能跟着 sticky */
  body > header{position:sticky;top:0;z-index:10;background:var(--c-surface)}
  header nav{display:flex;justify-content:space-between;align-items:center;
    padding:1rem 2rem;border-bottom:1px solid var(--c-border);background:var(--c-surface)}
  nav .logo{font-weight:bold;color:var(--c-primary);text-decoration:none}
  /* 清零 ul 默认 padding/margin：主站靠全局 *{margin:0;padding:0} 已清掉，
     本页没有全局重置，若不单独清零，ul 会保留浏览器默认 padding-left:40px
     + 上下 1em 外边距，导致导航菜单右移、比其它页"宽"。 */
  nav ul{display:flex;gap:1.5rem;list-style:none;flex-wrap:wrap;margin:0;padding:0}
  nav a{text-decoration:none;color:var(--c-text)}
  nav a.active{color:var(--c-primary);font-weight:600;
    border-bottom:2px solid var(--c-primary);padding-bottom:2px}
  body{margin:0;background:var(--c-bg);color:var(--c-text);
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:15px;line-height:1.7}
  .wrap{max-width:1080px;margin:0 auto;padding:26px 18px 70px}
  /* 只让 .wrap 内的「标题区」header 用 flex 并排（标题 + 按钮）。
     不能写成全局 header{display:flex}——那会把外层装导航的 header 也变成 flex 容器，
     nav 收缩成内容宽度，浅灰背景只铺左边一截，与主站其它页不一致。 */
  .wrap > header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
  header h1{margin:0 0 5px;font-size:25px;font-weight:600;letter-spacing:.5px}
  header p{margin:0;color:var(--muted);font-size:13px}
  .tag{display:inline-block;margin-top:9px;padding:3px 10px;border-radius:20px;
    background:var(--amber-l);color:var(--amber);font-size:12px}
  .topbtns{display:flex;gap:9px;flex-wrap:wrap}
  .btn{font:inherit;font-size:13px;padding:9px 15px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink)}
  .btn:hover{border-color:var(--green)}
  a.btn{text-decoration:none;display:inline-block}
  .btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
  .btn.primary:hover{background:var(--green-d)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .hud{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0 12px}
  @media(max-width:680px){.hud{grid-template-columns:repeat(2,1fr)}}
  /* 统计项做成入口：数字仍醒目，但整块可点、有 hover 与键盘焦点反馈 */
  .stat{position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:14px 16px;text-align:left;font:inherit;color:inherit;
    cursor:pointer;transition:.15s}
  .stat:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--green)}
  .stat:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .stat .n{font-size:24px;font-weight:600;line-height:1.1}
  .stat .l{font-size:12px;color:var(--muted);margin-top:3px}
  .stat .go{position:absolute;right:14px;top:13px;font-size:13px;color:var(--green);opacity:.45}
  .stat:hover .go{opacity:1}
  h2.sec,#areaGrid{scroll-margin-top:80px}
  .bar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:12px 0 20px;
    padding:12px 15px;background:var(--card);border:1px solid var(--line);border-radius:10px}
  .bar label{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
  .bar .spacer{flex:1}
  .bar .hint{font-size:12px;color:var(--muted)}
  .badges{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 22px}
  .badge{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:9px;
    background:#f1f2ee;border:1px solid var(--line);font-size:12px;color:var(--lock)}
  .badge.got{background:var(--amber-l);border-color:#ecd9b4;color:#8a621d}
  .badge .medal{width:18px;height:18px;border-radius:50%;background:#dfe1dc;
    display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
  .badge.got .medal{background:var(--amber)}
  .badge small{display:block;font-size:11px;color:var(--muted)}
  .badge.got small{color:#a07c3c}
  /* 首页徽章条的小圆点：带 icon 显示图案，未获得时灰度 */
  .badge .medal .ico{font-size:12px;line-height:1}
  .badge:not(.got) .medal .ico{filter:grayscale(1);opacity:.5}
  /* 徽章墙：六边形勋章（大气版） */
  .bwall{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;max-height:58vh;overflow:auto;padding-right:4px}
  @media(max-width:680px){.bwall{grid-template-columns:1fr}}
  .bcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;
    padding:20px 12px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px}
  .bcard.got{background:linear-gradient(180deg,#fffdf7,var(--amber-l));border-color:#ecd9b4}
  /* 外层只负责投影，让阴影贴合六边形轮廓 */
  .bmedal{width:84px;height:92px;filter:drop-shadow(0 5px 7px rgba(30,50,40,.18));
    display:flex;align-items:center;justify-content:center}
  /* 内层六边形：clip-path 造型 + 金属渐变 + 内嵌高光 */
  .bface{position:relative;width:100%;height:100%;
    -webkit-clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
    display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1;
    background:linear-gradient(160deg,#f2f4f1 0%,#ccd2cd 50%,#aeb5af 100%);color:var(--lock)}
  .bface:before{content:'';position:absolute;inset:5px;
    -webkit-clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
    background:linear-gradient(160deg,#fff 0%,#e6eae6 100%);opacity:.75;pointer-events:none}
  .bface .bico{position:relative;z-index:1;line-height:1}
  .bcard.got .bface{background:linear-gradient(160deg,#fbe6ad 0%,#dcae45 52%,#b5842f 100%);color:#6b470d}
  .bcard.got .bface:before{background:linear-gradient(160deg,#fff6db 0%,#f1d489 100%);opacity:.8}
  .bcard:not(.got) .bico{filter:grayscale(1);opacity:.55}
  .bcard .bn{font-size:14px;font-weight:600;color:var(--ink)}
  .bcard:not(.got) .bn{color:var(--lock)}
  .bcard .bd{font-size:11px;color:var(--muted);line-height:1.45}
  .bcard .bg{font-size:11px;color:var(--amber);font-weight:600}
  .bcard:not(.got) .bg{color:var(--lock)}
  h2.sec{font-size:16px;font-weight:600;margin:0 0 12px}
  .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(max-width:680px){.grid4{grid-template-columns:1fr}}
  .area{position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:17px 18px;cursor:pointer;transition:.15s}
  .area:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .area.locked{background:var(--lock-bg);cursor:not-allowed;color:var(--lock);border-color:#e5e7e2}
  .area.locked:hover{transform:none;box-shadow:none}
  .area .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .area .name{font-size:17px;font-weight:600}
  .area .pill{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--green-l);color:var(--green-d)}
  .area.locked .pill{background:#e2e4df;color:var(--lock)}
  .area .desc{font-size:12px;color:var(--muted);margin-top:8px}
  .area.locked .desc{color:var(--lock)}
  .prog{height:6px;border-radius:6px;background:#eceff0;overflow:hidden;margin-top:12px}
  .prog i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .3s}
  .area.locked .prog{background:#e0e2dd}
  .area .foot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
  .mask{position:fixed;inset:0;background:rgba(25,34,29,.55);display:none;
    align-items:center;justify-content:center;padding:18px;z-index:50}
  .mask.show{display:flex}
  /* 弹窗打开时锁背景滚动，防止滚动穿透到主页面 */
  html.modal-open,body.modal-open{overflow:hidden}
  /* 滚动到内容边界时不再把滚动链传给父级/背景页 */
  .modal,.sitelist,.bwall{overscroll-behavior:contain}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:640px;
    padding:24px;max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
  .modal h3{margin:0 0 4px;font-size:19px}
  .modal .sub{color:var(--muted);font-size:12px;margin:0 0 16px}
  .close{float:right;border:0;background:#f1f2ee;border-radius:7px;
    width:30px;height:30px;cursor:pointer;color:var(--muted);font-size:17px}
  .sitelist{display:grid;gap:9px;max-height:52vh;overflow:auto;padding-right:4px}
  .sitelist a.site{text-decoration:none;color:inherit}
  .site{display:flex;justify-content:space-between;align-items:center;gap:12px;
    border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:#fff}
  .site.done{background:var(--green-l);border-color:#cfe4db}
  .site .nm{font-size:14px;font-weight:500}
  .site .mt{font-size:11px;color:var(--muted);margin-top:2px}
  .site .go{font-size:12px;color:var(--green-d);white-space:nowrap}
  .site.done .go{color:var(--muted)}
  .site .gem{font-size:11px;color:var(--amber);margin-left:6px}
  .atlasgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
  @media(max-width:560px){.atlasgrid{grid-template-columns:repeat(3,1fr)}}
  .slot{border:1px solid var(--line);border-radius:10px;padding:11px 9px;min-height:96px;
    background:#fafbf8;cursor:default;text-align:center}
  .slot.got{background:var(--purple-l);border-color:#d8d4ef;cursor:pointer}
  .slot.got:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .slot.lit{background:#fafbf8;border-color:var(--line);cursor:pointer;border-style:dashed}
  .slot.lit:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .slot.lit .cn{color:var(--muted);font-weight:500}
  .slot .idx{font-size:10px;color:var(--muted)}
  .slot .cn{font-size:13px;font-weight:600;margin-top:5px;word-break:break-all}
  .slot .sci{font-size:10px;color:var(--muted);font-style:italic;margin-top:3px;word-break:break-all}
  .slot .q{font-size:22px;color:#c7ccc5;margin-top:16px}
  /* 图鉴本缩略图：统一 4:3 裁切，未收集仍显示问号 */
  .slot .thumb{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;
    border-radius:6px;background:#eeefe9;margin-bottom:6px}
  /* 详情大图 + 多角度切换 */
  .fossil-hero{margin:0 0 12px;padding:8px;background:var(--paper);border-radius:10px;text-align:center}
  .fossil-hero img{max-width:100%;max-height:42vh;object-fit:contain;border-radius:6px;
    cursor:zoom-in;background:#fff}
  .fossil-hero .credit{font-size:11px;color:var(--muted);margin-top:6px}
  .fp-thumbs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
  .fp-thumbs img{width:58px;height:44px;object-fit:cover;border-radius:5px;flex:0 0 auto;
    border:2px solid transparent;cursor:pointer;background:#eeefe9}
  .fp-thumbs img.on{border-color:var(--green)}
  .mystery-photo{margin-top:10px;text-align:center}
  .mystery-photo img{max-width:100%;max-height:30vh;object-fit:contain;border-radius:8px;background:#fff}
  .mystery-photo .credit{font-size:11px;color:var(--muted);margin-top:4px}
  .detail{font-size:13px;line-height:1.8}
  .detail .row{margin:6px 0}
  .detail .row b{color:var(--muted);font-weight:500;font-size:12px}
  .detail .feat{padding:12px;background:var(--paper);border-radius:8px;margin-top:10px}
  .drop{text-align:center;padding:14px 0}
  .drop .ico{font-size:34px}
  .drop h4{margin:8px 0 4px;font-size:17px}
  .drop p{color:var(--muted);font-size:13px}
  .found{background:var(--purple-l);border:1px solid #d8d4ef;border-radius:11px;
    padding:13px;margin:12px 0;text-align:left}
  .found .cn{font-size:16px;font-weight:600;color:var(--purple)}
  .found .sci{font-style:italic;color:var(--muted);font-size:12px}
  .unlockmsg{margin-top:12px;padding:11px 13px;border-radius:9px;
    background:var(--amber-l);color:#8a621d;font-size:13px}
  /* 从勘探/图鉴跳到主站真实档案的出口链接 */
  .golinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;
    border-top:1px dashed var(--line)}
  .golinks a{font-size:12px;color:var(--green-d);text-decoration:none;
    padding:5px 11px;border:1px solid var(--green);border-radius:7px;background:#fff}
  .golinks a:hover{background:var(--green-l)}
  .golinks .note{font-size:11px;color:var(--muted);align-self:center}
  .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:#25382f;color:#fff;padding:11px 20px;border-radius:22px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:80}
  .toast.show{opacity:1}
  /* 门槛：知识小考 */
  .lvbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px;
    padding:12px 15px;background:var(--card);border:1px solid var(--line);border-radius:10px}
  .lvbar .ttl{font-size:13px;font-weight:600}
  .lvbtn{font:inherit;font-size:12px;padding:6px 12px;border-radius:7px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--muted)}
  .lvbtn.on{background:var(--green);color:#fff;border-color:var(--green)}
  .lvbar .lvdesc{font-size:12px;color:var(--muted);margin-left:4px}
  .infocard{background:var(--paper);border:1px solid var(--line);border-radius:10px;
    padding:13px 15px;margin:0 0 16px}
  .infocard .hd{font-size:12px;color:var(--green-d);font-weight:600;margin-bottom:8px}
  .infocard .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;font-size:13px}
  @media(max-width:560px){.infocard .kv{grid-template-columns:1fr}}
  .infocard .kv b{color:var(--muted);font-weight:500;font-size:12px;margin-right:6px}
  .quizq{border-top:1px solid var(--line);padding:14px 0 4px}
  .quizq .qt{font-size:14px;font-weight:500;margin-bottom:9px}
  .quizq .qt em{font-style:normal;color:var(--green-d);font-size:11px;margin-left:6px}
  .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  @media(max-width:560px){.opts{grid-template-columns:1fr}}
  .opt{font:inherit;text-align:left;font-size:13px;padding:9px 12px;border-radius:8px;
    border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
  .opt:hover{border-color:var(--green)}
  .opt.sel{background:var(--green-l);border-color:var(--green);color:var(--green-d);font-weight:600}
  .opt.right{background:#e6f4ea;border-color:#5aa76f;color:#276c3a}
  .opt.wrong{background:#fdeaea;border-color:#d98a8a;color:#a33}
  .quizmsg{padding:11px 13px;border-radius:9px;font-size:13px;margin-top:14px}
  .quizmsg.ok{background:#e6f4ea;color:#276c3a}
  .quizmsg.no{background:#fdeaea;color:#a33}
  .quizmsg b{font-weight:600}
  /* 盲盒猜物种：紫色系，和门槛小考的绿色系区分开 */
  .mystery{text-align:center}
  .mystery .box{position:relative;background:linear-gradient(135deg,var(--purple-l),#f7f5fd);
    border:1px solid #d8d4ef;border-radius:12px;padding:22px 20px;margin:6px 0 16px}
  .mystery .box .qmark{font-size:26px;color:var(--purple);font-weight:600}
  .mystery .box .lbl{font-size:11px;color:var(--purple);letter-spacing:2px;margin-bottom:10px}
  .mystery .box .clue{font-size:15px;line-height:1.9;color:var(--ink)}
  .mystery .tags{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:13px}
  .mystery .tags span{font-size:11px;padding:3px 10px;border-radius:20px;
    background:#fff;border:1px solid #ddd8f0;color:var(--purple)}
  .mystery .moreline{margin-top:12px}
  .mystery .moreline button{font:inherit;font-size:11px;padding:4px 10px;border-radius:6px;
    border:1px dashed var(--purple);background:transparent;color:var(--purple);cursor:pointer}
  .mystery .morehint{font-size:12px;color:var(--purple);margin-top:9px;line-height:1.8}
  .mystery .opts{margin-top:4px}
  .mystery .opt{text-align:center;font-size:14px;padding:12px 10px}
  .mystery .score{font-size:12px;color:var(--muted);margin:0 0 12px}
  .mystery .score b{color:var(--purple);font-size:15px}
  .mystery .result{font-size:15px;margin:8px 0 14px;color:var(--green-d)}
  .mystery .result.no{color:#a33}
  .mystery .srcfont{font-size:11px;color:var(--muted);line-height:1.7;
    text-align:left;background:var(--paper);border-radius:8px;padding:10px 12px;margin-top:10px}
  .mystery .roundbar{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
  .mystery .roundbar i{width:22px;height:5px;border-radius:5px;background:#e0dced}
  .mystery .roundbar i.on{background:var(--purple)}
  .mystery .roundbar i.done{background:var(--green)}
</style>
</head>

<header>
  <nav>
    <a class="logo" href="index.html">赣鄱石语</a>
    <ul>
      <li><a href="index.html">首页</a></li>
      <li><a href="map.html">产地地图</a></li>

</header>
<div class="wrap">
  <header>
    <div>
      <h1>赣鄱石语 · 化石图鉴探索</h1>
      <p>从赣西北出发，探索产地 → 发现化石 → 集入图鉴 → 解锁新分区 → 赢得徽章</p>
      <span class="tag">科普互动 · 边读边探索</span>
    </div>
    <div class="topbtns">
      <a class="btn" href="map.html">🗺 产地地图</a>
      <a class="btn" href="list.html">📋 产地名录</a>
      <button class="btn" id="mysteryBtn">🎲 盲盒猜物种</button>
      <button class="btn primary" id="atlasBtn">我的图鉴本</button>
      <button class="btn" id="badgeBtn">徽章墙</button>
    </div>
  </header>

<style>
.gp-plate{position:relative;margin:18px 0 14px;padding:26px 28px 14px;background:#FBF8F1;border:1px solid #DAD3C2;outline:1px solid #DAD3C2;outline-offset:4px;overflow:hidden}
.gp-plate::before{content:"+";position:absolute;left:10px;top:6px;color:#B9B2A0;font-family:serif;font-size:1.05rem}
.gp-plate::after{content:"+";position:absolute;right:10px;bottom:4px;color:#B9B2A0;font-family:serif;font-size:1.05rem}
.gp-main{display:block;width:min(640px,74%);margin:0 auto;filter:drop-shadow(0 0 14px rgba(31,92,77,.12))}

</style>
<div class="gp-plate">
  <img class="gp-amm" src="assets/amm_lineart_ink.png" alt="菊石线描">
  <img class="gp-tri" src="assets/tri_lineart_ink.png" alt="三叶虫线描">
  <img class="gp-main" src="assets/skel_dino_ink.png" alt="棘龙骨架科学线描图">
  <div class="gp-cap">图源：Wikimedia Commons · CC BY-SA 4.0</div>
</div>
  <div class="hud">
    <button type="button" class="stat" data-go="found" title="查看已探索产地清单"><div class="n" id="sFound">0</div><div class="l">已探索产地<span class="go">→</span></div></button>
    <button type="button" class="stat" data-go="fossil" title="打开我的图鉴本"><div class="n" id="sFossil">0/0</div><div class="l">已收集化石（可探索）<span class="go">→</span></div></button>
    <button type="button" class="stat" data-go="area" title="查看四个分区并进入"><div class="n" id="sArea">1/4</div><div class="l">已解锁分区<span class="go">→</span></div></button>
    <button type="button" class="stat" data-go="badge" title="打开徽章墙"><div class="n" id="sBadge">0/10</div><div class="l">已获得徽章<span class="go">→</span></div></button>
  </div>

  <div class="lvbar">
    <span class="ttl">门槛强度</span>
    <button class="lvbtn" data-lv="easy">轻松</button>
    <button class="lvbtn" data-lv="normal">标准</button>
    <button class="lvbtn" data-lv="hard">挑战</button>
    <span class="lvdesc" id="lvdesc"></span>
  </div>

  <div class="bar">
    <span class="hint" id="hint">点开产地 → 先读信息卡 → 答对题目才算勘探成功</span>
    <span class="spacer"></span>
    <button class="btn" id="resetBtn">重置进度</button>
  </div>

  <div class="badges" id="badges"></div>

  <h2 class="sec">四个化石分区</h2>
  <div class="grid4" id="areaGrid"></div>
  <p style="font-size:11px;color:var(--muted);margin-top:14px" id="areaNote">
    说明：化石按图鉴文件中的 <code>tapho_link</code> 真实对应到产地，不推测、不编造；
    各区线索化石数量以当前图鉴数据为准，探索本身计入解锁进度。
  </p>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="atlas-demo-data.js"></script>
<script src="atlas-logic.js"></script>
<script src="atlas-quiz.js"></script>
<script src="atlas-mystery.js"></script>
<script>
(function(){
  'use strict';
  var L=window.ATLAS_LOGIC, Q=window.ATLAS_QUIZ, M=window.ATLAS_MYSTERY,
      SITES=window.ATLAS_SITES||[], SPECIES=window.ATLAS_SPECIES||[];
  /* 盲盒玩法的本地状态：与探索进度完全隔离，不参与解锁/徽章 */
  var MY_BEST='gbsy_mystery_best';
  var myQs=[], myIdx=0, myRight=0, myAnswered=false, myMore=0;
  /* Safari 无痕、禁用站点数据、部分 file:// 环境下，读取 window.localStorage
     本身就会抛 SecurityError——不接住会让整段脚本中断、分区与按钮全失效。
     降级到内存版：本次会话照常体验，刷新不留存，总比白屏好。 */
  var store;
  try { store=window.localStorage; }
  catch(e){
    var memStore={};
    store={
      getItem:function(k){return Object.prototype.hasOwnProperty.call(memStore,k)?memStore[k]:null},
      setItem:function(k,v){memStore[k]=String(v)},
      removeItem:function(k){delete memStore[k]}
    };
  }
  var state=L.load(store);
  /* 线上版不提供演示模式：旧版本会把 demo=true 写进 localStorage，老访客刷新后仍停在
     "全解锁"的演示态，这里统一退回正式进度（setDemo(false) 会还原演示前的解锁数）。
     答辩用的演示版由 tools/make_demo_page.py 从本页派生，标志位在下面这块里替换。 */
  /* DEMO-SWITCH-START */
  try {
    if (state.demo) { state = L.setDemo(store, state, false); }
  } catch (e) {}
  /* DEMO-SWITCH-END */
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
  /* 弹窗开关统一锁/放背景滚动：直接改 body.style.overflow，
     这样所有入口（含 8 处内联 × 按钮的 classList.remove）都会经 MutationObserver 同步。 */
  function setBodyLock(on){
    /* html 与 body 都锁，兼容「只锁 body 仍可滚」的浏览器 */
    var v=on?'hidden':'';
    document.documentElement.style.overflow=v;
    document.body.style.overflow=v;
  }
  /* 内联关闭按钮绕过 close()，用观察器兜底同步锁状态 */
  try {
    new MutationObserver(function(){
      setBodyLock($('mask').classList.contains('show'));
    }).observe($('mask'),{attributes:true,attributeFilter:['class']});
  } catch(e) {}
  function open(html){$('modal').innerHTML=html;$('mask').classList.add('show');setBodyLock(true);}
  function close(){$('mask').classList.remove('show');setBodyLock(false);}
  function byArea(a){return SITES.filter(function(r){return r.region===a;});}
  function fossilsHere(site){return SPECIES.filter(function(f){return f.tapho_link===site.id;});}

  function newBadges(before,after){
    var a={};before.forEach(function(x){if(x.got)a[x.id]=1;});
    return after.filter(function(x){return x.got&&!a[x.id];});
  }

  function render(){
    var st=L.stats(state,SPECIES);
    $('sFound').textContent=st.found;
    $('sFossil').textContent=st.fossils+'/'+st.collectable;
    $('sArea').textContent=st.unlocked+'/4';
    $('sBadge').textContent=st.badges+'/'+(L.BADGES?L.BADGES.length:5);
    var lv=L.LEVELS[state.level]||L.LEVELS.normal;
    $('lvdesc').textContent=lv.desc+' · 答对才算数';
    Array.prototype.forEach.call(document.querySelectorAll('.lvbtn'),function(b){
      b.classList.toggle('on',b.getAttribute('data-lv')===state.level);
    });
    $('hint').textContent=state.demo
      ?'演示模式：跳过答题，全部解锁 + 全图鉴预览'
      :'点开产地 → 先读信息卡 → 答对 '+lv.quiz+' 题才算勘探成功；每区 '+lv.need+' 处解锁下一区';

    $('badges').innerHTML=L.badges(state,SPECIES).map(function(b){
      return '<div class="badge '+(b.got?'got':'')+'"><span class="medal">'+(b.icon?'<span class="ico">'+b.icon+'</span>':(b.got?'✓':'·'))+'</span>'+
        '<span>'+esc(b.name)+'<small>'+esc(b.desc)+'</small></span></div>';
    }).join('');

    var g=$('areaGrid');g.innerHTML='';
    L.AREAS.forEach(function(a,i){
      var ok=L.canEnter(state,i), rows=byArea(a), n=L.foundIn(state,a,SITES);
      var d=document.createElement('div');
      d.className='area'+(ok?'':' locked');
      var gems=rows.filter(function(r){return fossilsHere(r).length;}).length;
      var pill=ok?(state.demo?'预览':(i===state.unlocked-1?'探索中':'已解锁')):'未解锁';
      var foot=ok?('已探索 '+n+' / '+rows.length+' 处 · 藏有化石的产地 '+gems+' 处'):('通关「'+L.AREAS[i-1]+'」后开放');
      d.innerHTML='<div class="top"><span class="name">'+esc(a)+'</span><span class="pill">'+pill+'</span></div>'+
        '<div class="desc">'+rows.length+' 处产地记录'+(gems?'，其中 '+gems+' 处藏有化石':'，暂无化石线索')+'</div>'+
        '<div class="prog"><i style="width:'+Math.min(100,Math.round(n/rows.length*100))+'%"></i></div>'+
        '<div class="foot"><span>'+esc(foot)+'</span><span>'+(ok?'进入 →':'锁定')+'</span></div>';
      if(ok)d.onclick=function(){openArea(a);};
      g.appendChild(d);
    });
  }

  function openArea(area){
    var rows=byArea(area), ids={};state.found.forEach(function(id){ids[id]=1;});
    var html='<button class="close" onclick="document.getElementById(\'mask\').classList.remove(\'show\')">×</button>'+
      '<h3>'+esc(area)+' · 产地探索</h3>'+
      '<p class="sub">点击一处产地进行勘探；藏有化石的产地会掉落图鉴卡片</p><div class="sitelist">';
    rows.forEach(function(r){
      var fs=fossilsHere(r), done=!!ids[r.id];
      html+='<div class="site '+(done?'done':'')+'" data-id="'+esc(r.id)+'">'+
        '<div><div class="nm">'+esc(r.name)+(fs.length?'<span class="gem">◆ 藏有化石</span>':'')+'</div>'+
        '<div class="mt">'+esc(r.id)+' · '+esc(r.city_county||'')+' · '+esc(r.geological_age||'')+' · '+esc(r.fossil_group||'')+'</div></div>'+
        '<div class="go">'+(done?'已勘探':'勘探 →')+'</div></div>';
    });
    html+='</div><div class="acts"><button class="btn" id="closeArea">返回</button></div>';
    open(html);
    $('closeArea').onclick=close;
    Array.prototype.forEach.call($('modal').querySelectorAll('.site'),function(el){
      el.onclick=function(){
        var id=el.getAttribute('data-id');
        var site=SITES.filter(function(r){return r.id===id;})[0];
        if(site)doExplore(site);
      };
    });
  }

  /* 点产地：演示模式直接勘探；否则先过知识小考 */
  function doExplore(site){
    if(state.demo){ invokeExplore(site, true); return; }
    openQuiz(site);
  }

  /* 门槛关卡：先给真实信息卡，再从卡上字段出题，全对才放行 */
  function openQuiz(site){
    var qs=Q.make(site,SITES,L.quizOf(state));
    if(!qs.length){ invokeExplore(site, true); return; }  // 极少数字段全空：不设门槛
    var html='<button class="close" onclick="document.getElementById(\'mask\').classList.remove(\'show\')">×</button>'+
      '<h3>勘探前的知识小考</h3>'+
      '<p class="sub">先读下方信息卡，再答题。全部答对才算勘探成功（答案都在卡上，不用背）。</p>'+
      '<div class="infocard"><div class="hd">产地信息卡 · '+esc(site.id)+'</div><div class="kv">'+
      '<div><b>名称</b>'+esc(site.name)+'</div>'+
      '<div><b>位置</b>'+esc(site.city_county||'—')+'</div>'+
      '<div><b>年代</b>'+esc(site.geological_age||'—')+'</div>'+
      '<div><b>门类</b>'+esc(site.fossil_group||'—')+'</div>'+
      '<div><b>级别</b>'+esc(site.protection_level||'—')+'</div>'+
      '<div><b>分区</b>'+esc(site.region||'—')+'</div>'+
      '</div>'+
      '<div class="golinks"><a href="map.html?code='+encodeURIComponent(site.id)+'">🗺 地图定位</a>'+
      '<a href="list.html?q='+encodeURIComponent(site.id)+'">📋 名录档案</a>'+
      '<span class="note">答案就在卡上；想看完整数据可点这里</span></div></div><div id="qlist">';
    qs.forEach(function(q,i){
      html+='<div class="quizq" data-i="'+i+'"><div class="qt">'+(i+1)+'. '+esc(q.q)+
        '<em>单选</em></div><div class="opts">';
      q.options.forEach(function(op){
        html+='<button class="opt" data-i="'+i+'" data-v="'+esc(op)+'">'+esc(op)+'</button>';
      });
      html+='</div></div>';
    });
    html+='</div><div id="qmsg"></div>'+
      '<div class="acts"><button class="btn" id="quizBack">返回分区</button>'+
      '<button class="btn primary" id="quizSubmit">提交答卷</button></div>';
    open(html);
    var chosen={};
    Array.prototype.forEach.call($('modal').querySelectorAll('.opt'),function(el){
      el.onclick=function(){
        var i=el.getAttribute('data-i');
        Array.prototype.forEach.call($('modal').querySelectorAll('.opt[data-i="'+i+'"]'),function(o){o.classList.remove('sel');});
        el.classList.add('sel');
        chosen[i]=el.getAttribute('data-v');
      };
    });
    $('quizBack').onclick=function(){close();render();};
    $('quizSubmit').onclick=function(){
      var right=0;
      qs.forEach(function(q,i){
        if(Q.check(q,chosen[i]))right++;
      });
      if(right===qs.length){
        invokeExplore(site,true);
        return;
      }
      /* 未全对：标出对错，给出线索，允许重试；不计入探索 */
      Array.prototype.forEach.call($('modal').querySelectorAll('.opt'),function(el){
        var i=el.getAttribute('data-i'), q=qs[i];
        el.classList.remove('sel');
        if(el.getAttribute('data-v')===q.answer)el.classList.add('right');
        else if(el.getAttribute('data-v')===chosen[i])el.classList.add('wrong');
      });
      var firstWrong=-1;
      qs.forEach(function(q,i){if(firstWrong<0&&!Q.check(q,chosen[i]))firstWrong=i;});
      $('qmsg').innerHTML='<div class="quizmsg no">答对 '+right+' / '+qs.length+' 题，还没通过。'+
        esc(qs[firstWrong].tip)+'。可以重看信息卡再答一次。</div>';
      $('quizSubmit').textContent='重新作答';
    };
  }

  /* 勘探成功后的掉落、解锁与徽章展示 */
  function invokeExplore(site,passed){
    var before=L.badges(state,SPECIES);
    var r=L.explore(store,state,site,SITES,SPECIES,passed);
    if(r.already){toast('这处产地已经勘探过了');return;}
    if(r.failed){toast('题目还没答对，再试一次');return;}
    var html='<button class="close" onclick="document.getElementById(\'mask\').classList.remove(\'show\')">×</button>'+
      '<div class="drop"><div class="ico">⛏</div><h4>'+(state.demo?'演示勘探':'勘探通过')+'</h4>'+
      '<p>'+esc(site.name)+'</p></div>'+
      '<div class="detail">'+
      '<div class="row"><b>编号</b> '+esc(site.id)+'</div>'+
      '<div class="row"><b>位置</b> '+esc(site.city_county||'—')+'</div>'+
      '<div class="row"><b>年代</b> '+esc(site.geological_age||'—')+'</div>'+
      '<div class="row"><b>级别</b> '+esc(site.protection_level||'—')+'</div>'+
      '<div class="golinks"><a href="map.html?code='+encodeURIComponent(site.id)+'">🗺 在地图定位</a>'+
      '<a href="list.html?q='+encodeURIComponent(site.id)+'">📋 查名录档案</a>'+
      '<span class="note">看这处产地的完整数据</span></div></div>';
    if(r.fossils.length){
      html+='<div class="found"><div style="font-size:12px;color:var(--muted)">发现化石 '+r.fossils.length+' 条</div>';
      r.fossils.forEach(function(f){
        html+='<div style="margin-top:8px"><span class="cn">'+esc(f.cn_name)+'</span> '+
          '<span class="sci">'+esc(f.genus+' '+f.species)+'</span></div>';
      });
      html+='</div>';
    }else{
      html+='<p style="font-size:12px;color:var(--muted)">该产地暂无物种图鉴线索，探索进度已计入解锁。</p>';
    }
    if(r.unlockedAreas.length){
      html+='<div class="unlockmsg">新分区解锁：'+esc(r.unlockedAreas.join('、'))+'</div>';
    }
    var nb=newBadges(before,L.badges(state,SPECIES));
    if(nb.length)html+='<div class="unlockmsg">获得徽章：'+esc(nb.map(function(b){return b.name;}).join('、'))+'</div>';
    html+='<div class="acts">';
    if(r.fossils.length)html+='<button class="btn primary" id="collectBtn">收入我的图鉴</button>';
    html+='<button class="btn" id="backArea">返回分区</button></div>';
    open(html);
    if(r.fossils.length)$('collectBtn').onclick=function(){
      var added=0;r.fossils.forEach(function(f){if(L.collect(store,state,f))added++;});
      close();render();
      toast(added?('已收入图鉴 '+added+' 条'):'这几条已经在图鉴里了');
    };
    $('backArea').onclick=function(){close();render();};
    render();
  }

  /* 标本照片：主图 + 多角度缩略图 + 来源标注。无图返回空串，版面与旧版一致 */
  function photoHTML(f){
    var imgs=(f.images&&f.images.length)?f.images:(f.image?[f.image]:[]);
    if(!imgs.length)return '';
    var h='<div class="fossil-hero"><a href="'+esc(imgs[0])+'" target="_blank" rel="noopener">'+
      '<img id="fpMain" src="'+esc(imgs[0])+'" alt="'+esc((f.cn_name||'化石')+'标本照片')+'" loading="lazy"></a>'+
      '<div class="credit">图片来源：'+esc(f.image_credit||'《江西省古生物化石图册》')+'</div></div>';
    if(imgs.length>1){
      h+='<div class="fp-thumbs" id="fpThumbs">';
      imgs.forEach(function(u,i){
        h+='<img src="'+esc(u)+'" data-u="'+esc(u)+'" class="'+(i===0?'on':'')+'" alt="角度'+(i+1)+'" loading="lazy">';
      });
      h+='</div>';
    }
    return h;
  }
  function bindPhotoSwitch(){
    var box=$('fpThumbs'),main=$('fpMain');
    if(!box||!main)return;
    Array.prototype.forEach.call(box.querySelectorAll('img'),function(t){
      t.onclick=function(){
        main.src=t.getAttribute('data-u');
        var a=main.parentNode;
        if(a&&a.tagName==='A')a.href=t.getAttribute('data-u');
        Array.prototype.forEach.call(box.querySelectorAll('img'),function(x){x.classList.remove('on');});
        t.classList.add('on');
      };
    });
  }

  /* 单条物种详情：图鉴本点击与「?species=」直达共用同一段渲染 */
  function openSpeciesDetail(f){
    if(!f)return;
    var h='<button class="close" onclick="document.getElementById(\'mask\').classList.remove(\'show\')">×</button>'+
      '<h3>'+esc(f.cn_name)+'</h3><p class="sub"><i>'+esc(f.genus+' '+f.species)+'</i> · '+esc(f.author_year||'')+'</p>'+
      photoHTML(f)+
      '<div class="detail">'+
      '<div class="row"><b>年代</b> '+esc(f.age||'—')+'</div>'+
      '<div class="row"><b>分类</b> '+esc(f.classification||'—')+'</div>'+
      '<div class="row"><b>产地</b> '+esc(f.tapho_link||'具体不详')+'</div>'+
      '<div class="row"><b>门类</b> '+esc(f.taxa||'—')+'</div>'+
      '<div class="feat">'+esc(f.features||'—')+'</div>'+
      '<div class="row" style="margin-top:10px"><b>文献</b> '+esc(f.reference||'—')+'</div>'+
      (f.tapho_link?('<div class="golinks"><a href="map.html?code='+encodeURIComponent(f.tapho_link)+'">🗺 看产地在地图上的位置</a>'+
        '<a href="list.html?q='+encodeURIComponent(f.tapho_link)+'">📋 查产地档案</a></div>'):'')+
      '</div>'+
      '<div class="acts"><button class="btn" id="backAtlas">返回图鉴本</button></div>';
    open(h);$('backAtlas').onclick=openAtlas;
    bindPhotoSwitch();
  }

  function openAtlas(){
    var got={};state.fossils.forEach(function(n){got[n]=1;});
    var preview=state.demo;
    var html='<button class="close" onclick="document.getElementById(\'mask\').classList.remove(\'show\')">×</button>'+
      '<h3>化石图鉴本</h3><p class="sub">'+(preview?'演示模式预览：全部条目可见':'已收集 '+state.fossils.length+' / '+L.collectableCount(SPECIES)+' 条可探索图鉴；点击已收集条目看鉴定要点')+'</p>'+
      '<div class="atlasgrid">';
    SPECIES.forEach(function(f,i){
      var has=preview||got[f.cn_name];
      var noSite=!f.tapho_link;                       // 无产地编号：不可通过探索获得
      var cls=has?'got':(noSite?'lit':'');
      var img0=(f.images&&f.images[0])||f.image||'';
      /* 可查看的条目才露图；未解锁的保持问号，不提前剧透 */
      var thumb=((has||noSite)&&img0)
        ? '<img class="thumb" src="'+esc(img0)+'" alt="'+esc(f.cn_name)+'" loading="lazy">' : '';
      html+='<div class="slot '+cls+'" '+((has||noSite)?'data-i="'+i+'"':'')+'>'+
        '<div class="idx">No.'+(i+1)+(noSite?' · 文献':'')+'</div>'+thumb+
        (has?('<div class="cn">'+esc(f.cn_name)+'</div><div class="sci">'+esc(f.genus+' '+f.species)+'</div>')
            :noSite?('<div class="cn">'+esc(f.cn_name)+'</div><div class="sci">产地不详</div>')
            :'<div class="q">？</div>')+'</div>';
    });
    html+='</div><div class="acts"><button class="btn" id="closeAtlas">关闭</button></div>';
    open(html);
    $('closeAtlas').onclick=close;
    Array.prototype.forEach.call($('modal').querySelectorAll('.slot.got, .slot.lit'),function(el){
      el.onclick=function(){
        openSpeciesDetail(SPECIES[parseInt(el.getAttribute('data-i'),10)]);
      };
    });
  }

  function openBadges(){
    var html='<button class="close" onclick="document.getElementById(\'mask\').classList.remove(\'show\')">×</button>'+
      '<h3>徽章墙</h3><p class="sub">按探索与收集进度自动授予</p><div class="bwall">';
    L.badges(state,SPECIES).forEach(function(b){
      var face=b.icon?('<span class="bico">'+b.icon+'</span>'):(b.got?'✓':'·');
      html+='<div class="bcard '+(b.got?'got':'')+'">'+
        '<div class="bmedal"><div class="bface">'+face+'</div></div>'+
        '<div class="bn">'+esc(b.name)+'</div>'+
        '<div class="bd">'+esc(b.desc)+'</div>'+
        '<div class="bg">'+(b.got?'已获得':'未获得')+'</div></div>';
    });
    html+='</div><div class="acts"><button class="btn" id="closeBadge">关闭</button></div>';
    open(html);$('closeBadge').onclick=close;
  }

  /* 统计栏入口①：已探索产地清单。点条目直接去地图看该产地，不在弹窗里复述字段。 */
  function openFound(){
    var ids={};state.found.forEach(function(id){ids[id]=1;});
    var rows=SITES.filter(function(r){return ids[r.id];});
    var html='<button class="close" onclick="document.getElementById(\'mask\').classList.remove(\'show\')">×</button>'+
      '<h3>已探索产地</h3><p class="sub">共 '+rows.length+' 处 · 点条目可看它在地图上的位置</p>';
    if(!rows.length){
      html+='<p style="font-size:13px;color:var(--muted)">还没有探索记录。到下面的四个化石分区开始勘探吧。</p>'+
        '<div class="acts"><button class="btn primary" id="goAreas">去看分区 →</button></div>';
    }else{
      html+='<div class="sitelist">';
      rows.forEach(function(r){
        html+='<a class="site" href="map.html?code='+encodeURIComponent(r.id)+'">'+
          '<div><div class="nm">'+esc(r.name)+
          (fossilsHere(r).length?'<span class="gem">◆ 藏有化石</span>':'')+'</div>'+
          '<div class="mt">'+esc(r.id)+' · '+esc(r.city_county||'')+' · '+esc(r.geological_age||'')+'</div></div>'+
          '<div class="go">地图 →</div></a>';
      });
      html+='</div><div class="acts"><button class="btn" id="closeFound">关闭</button></div>';
    }
    open(html);
    if($('closeFound'))$('closeFound').onclick=close;
    if($('goAreas'))$('goAreas').onclick=function(){
      close();document.getElementById('areaGrid').scrollIntoView({behavior:'smooth',block:'start'});
    };
  }

  /* 统计栏入口②：分区总览。未解锁的只写解锁条件，不给进入。 */
  function openAreas(){
    var html='<button class="close" onclick="document.getElementById(\'mask\').classList.remove(\'show\')">×</button>'+
      '<h3>四个化石分区</h3><p class="sub">完成当前分区的勘探目标，即可解锁下一区</p><div class="sitelist">';
    L.AREAS.forEach(function(a,i){
      var ok=L.canEnter(state,i), rows=byArea(a), n=L.foundIn(state,a,SITES);
      html+='<div class="site'+(ok?'':' locked')+'" data-i="'+i+'"'+
        (ok?'':' style="opacity:.55;cursor:not-allowed"')+'>'+
        '<div><div class="nm">'+esc(a)+'</div><div class="mt">'+
        (ok?('已探索 '+n+' / '+rows.length+' 处'):('通关「'+esc(L.AREAS[i-1])+'」后开放'))+
        '</div></div><div class="go">'+(ok?'进入 →':'未解锁')+'</div></div>';
    });
    html+='</div><div class="acts"><button class="btn" id="closeAreas">关闭</button></div>';
    open(html);
    $('closeAreas').onclick=close;
    Array.prototype.forEach.call($('modal').querySelectorAll('.site:not(.locked)'),function(el){
      el.onclick=function(){
        close();openArea(L.AREAS[parseInt(el.getAttribute('data-i'),10)]);
      };
    });
  }

  /* ===== 盲盒猜物种：读真实鉴定特征，猜化石名。线索逐字出自图鉴 features ===== */
  function bestScore(){
    try{var v=parseInt(store.getItem(MY_BEST),10);return isNaN(v)?0:v;}catch(e){return 0;}
  }
  function saveBest(n){
    if(n>bestScore()){try{store.setItem(MY_BEST,String(n));}catch(e){}}
  }
  function openMystery(seed){
    if(!M||!SPECIES.length){toast('图鉴数据未加载');return;}
    var total=Math.min(5,SPECIES.length);
    myQs=M.make(SPECIES,total,seed==null?('round-'+Date.now()):seed);
    myIdx=0;myRight=0;myAnswered=false;myMore=0;
    renderMystery();
  }
  function renderMystery(){
    var q=myQs[myIdx];
    if(!q){return;}
    var bars='';
    myQs.forEach(function(_,i){
      bars+='<i class="'+(i<myIdx?'done':(i===myIdx?'on':''))+'"></i>';
    });
    var html='<button class="close" onclick="document.getElementById(\'mask\').classList.remove(\'show\')">×</button>'+
      '<h3>🎲 盲盒猜物种</h3>'+
      '<p class="sub">读一段真实的鉴定特征，猜它是哪种化石。线索逐字摘自图鉴原文，干扰项也都是真实物种。</p>'+
      '<div class="score">第 <b>'+(myIdx+1)+' / '+myQs.length+'</b> 题 · 已答对 <b>'+myRight+'</b> 题 · 最佳 '+bestScore()+' 题</div>'+
      '<div class="roundbar">'+bars+'</div>'+
      '<div class="mystery"><div class="box">'+
      '<div class="qmark">?</div><div class="lbl">鉴 定 特 征</div>'+
      '<div class="clue" id="clueText">'+esc(q.clue)+'</div>'+
      '<div class="tags"><span>'+esc(q.taxa||'化石')+'</span>'+
      (q.age?'<span>'+esc(q.age)+'</span>':'')+
      (q.region?'<span>'+esc(q.region)+'</span>':'')+'</div>'+
      ((q.moreClues&&q.moreClues.length)?'<div class="moreline"><button id="moreBtn">再给一条线索</button></div><div class="morehint" id="moreHint"></div>':'')+
      '</div><div class="opts" id="myOpts">';
    q.options.forEach(function(op){
      html+='<button class="opt" data-v="'+esc(op)+'">'+esc(op)+'</button>';
    });
    html+='</div><div id="myFeedback"></div>'+
      '<div class="acts" id="myActs"><button class="btn" id="myQuit">退出盲盒</button></div></div>';
    open(html);
    $('myQuit').onclick=function(){saveBest(myRight);close();render();};
    if($('moreBtn'))$('moreBtn').onclick=function(){
      if(myMore<(q.moreClues||[]).length){
        $('moreHint').innerHTML+='<div>补充线索：'+esc(q.moreClues[myMore])+'</div>';
        myMore++;
        if(myMore>=(q.moreClues||[]).length)this.disabled=true;
      }
    };
    Array.prototype.forEach.call($('myOpts').querySelectorAll('.opt'),function(el){
      el.onclick=function(){myAnswer(q,el);};
    });
  }
  function myAnswer(q,el){
    if(myAnswered)return;
    myAnswered=true;
    var picked=el.getAttribute('data-v'), right=M.check(q,picked);
    if(right)myRight++;
    Array.prototype.forEach.call($('myOpts').querySelectorAll('.opt'),function(o){
      var v=o.getAttribute('data-v');
      if(v===q.answer)o.classList.add('right');
      else if(v===picked)o.classList.add('wrong');
      o.disabled=true;
    });
    /* 答完立刻展示原文出处：即使猜错也是一次科普，不白点。
       若该物种有标本照，一并亮出来，盲盒才算真的「开箱」。 */
    var hit=null;
    for(var i=0;i<SPECIES.length;i++){if(SPECIES[i].cn_name===q.answer){hit=SPECIES[i];break;}}
    var ph='';
    if(hit){
      var u=(hit.images&&hit.images[0])||hit.image||'';
      if(u)ph='<div class="mystery-photo"><img src="'+esc(u)+'" alt="'+esc(q.answer)+'标本照片" loading="lazy">'+
        '<div class="credit">图片来源：'+esc(hit.image_credit||'《江西省古生物化石图册》')+'</div></div>';
    }
    var fb='<div class="result '+(right?'':'no')+'">'+
      (right?'✓ 答对了！':'✗ 答案是「'+esc(q.answer)+'」')+'</div>'+ph+
      '<div class="srcfont"><b>原文出处（'+esc([q.genus,q.species].filter(Boolean).join(' ')||'图鉴条目')+'）</b><br>'+esc(q.detail)+
      (q.reference?'<br><b>文献：</b>'+esc(q.reference):'')+'</div>';
    $('myFeedback').innerHTML=fb;
    $('myActs').innerHTML='<button class="btn" id="myQuit">退出盲盒</button>'+
      (myIdx+1<myQs.length?'<button class="btn primary" id="myNext">下一题 →</button>'
                          :'<button class="btn primary" id="myNext">查看成绩</button>');
    $('myQuit').onclick=function(){saveBest(myRight);close();render();};
    $('myNext').onclick=function(){
      myIdx++;myAnswered=false;myMore=0;
      if(myIdx>=myQs.length){myResult();return;}
      renderMystery();
    };
  }
  function myResult(){
    saveBest(myRight);
    var n=myQs.length, best=bestScore();
    var word=myRight===n?'全对！化石侦探本探 🔍':(myRight>=n/2?'不错，已经认得不少了':'再多读几页图鉴就能认出来');
    var html='<button class="close" onclick="document.getElementById(\'mask\').classList.remove(\'show\')">×</button>'+
      '<div class="mystery"><h3>🎲 盲盒挑战完成</h3>'+
      '<div style="font-size:40px;margin:14px 0 6px">'+myRight+' <span style="font-size:16px;color:var(--muted)">/ '+n+'</span></div>'+
      '<div class="result">'+esc(word)+'</div>'+
      '<p class="sub" style="text-align:center">最佳成绩 '+best+' / '+n+' · 线索全部出自真实图鉴原文</p>'+
      '<div class="acts" style="justify-content:center"><button class="btn" id="myBack">返回探索</button>'+
      '<button class="btn primary" id="myAgain">换一批再猜</button></div></div>';
    open(html);
    $('myBack').onclick=function(){close();render();};
    $('myAgain').onclick=function(){openMystery();};
    render();
  }

  $('mysteryBtn').onclick=function(){openMystery();};
  $('atlasBtn').onclick=openAtlas;
  $('badgeBtn').onclick=openBadges;
  /* HUD 四个统计项都可点进去：已探索产地 / 图鉴本 / 分区总览 / 徽章墙 */
  Array.prototype.forEach.call(document.querySelectorAll('.hud .stat'),function(el){
    el.onclick=function(){
      var go=el.getAttribute('data-go');
      if(go==='found')openFound();
      else if(go==='fossil')openAtlas();
      else if(go==='area')openAreas();
      else if(go==='badge')openBadges();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.lvbtn'),function(b){
    b.onclick=function(){
      state=L.setLevel(store,state,b.getAttribute('data-lv'));
      render();
      toast('门槛已切换为「'+(L.LEVELS[state.level].label)+'」，进度保留');
    };
  });
  $('resetBtn').onclick=function(){
    if(!confirm('重置全部探索、图鉴与徽章进度？'))return;
    state=L.reset(store);close();render();toast('进度已重置');
  };
  $('mask').onclick=function(e){if(e.target===this)close();};
  render();

  /* 从首页/地图页「看完整鉴定要点」跳进来：atlas.html?species=<中文名或拉丁名>
     直达该条详情，不必自己在图鉴本里翻找。按中文名优先、拉丁双名兜底匹配，
     与 js/species.js 的链接生成规则一致；找不到时静默留在首页，不弹错提示。 */
  try {
    var want=new URLSearchParams(location.search).get('species');
    if(want){
      var hit=SPECIES.filter(function(f){
        return (f.cn_name&&f.cn_name===want)||
               (!f.cn_name&&[f.genus,f.species].filter(Boolean).join(' ')===want);
      })[0];
      if(hit)openSpeciesDetail(hit);
    }
  } catch(e) {}
})();
</script>
</body>
</html>
